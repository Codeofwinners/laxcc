      lat: 33.804917,

    },
    {

      type: "beach",
      desc: "World-famous pier with the Pacific Park amusement park, the original Route 66 endpoint, and the ferris wheel that lights up after dark. Edibles take 30–60 minutes to kick in — perfect timing for a slow walk down the pier into golden hour.",
      lat: 34.0082821,

    },
    {
      name: "Will Rogers State Beach",
      type: "beach",
      desc: "Wide sandy beach with full lifeguard coverage, quieter than Santa Monica and great for swimming. Family-friendly Pacific Palisades coastline. A small-dose pill or low-mg disposable vape is the most discreet pick on a calm crowd-free beach.",
      lat: 34.0350564,
      lng: -118.5366589,
      mapsLink: "https://www.google.com/maps/search/?api=1&query=Will+Rogers+State+Beach"
    }
  ];

  let map;
  let markers = [];
  let infoWindow;

  function renderList() {
    const list = document.getElementById("laxccPlacesList");
    if (!list) return;

    list.innerHTML = DATA.map((loc, index) => {
      return `
        <div class="laxcc-location" data-index="${index}" id="laxcc-location-${index}">
          <div class="laxcc-location-thumb laxcc-thumb-${loc.type}">${index + 1}</div>
          <div class="laxcc-location-content">
            <div class="laxcc-location-top">
              <div class="laxcc-location-name">${loc.name}</div>
              <span class="laxcc-badge ${loc.type}">
                ${loc.type === "dispensary" ? "Dispensary" : "Beach"}
              </span>
            </div>
            <p class="laxcc-desc">${loc.desc}</p>
            <a class="laxcc-directions" href="${loc.mapsLink}" target="_blank" rel="noopener">
              Directions
            </a>
          </div>
        </div>
      `;
    }).join("");

    list.querySelectorAll(".laxcc-location").forEach(item => {
      item.addEventListener("click", function (e) {
        if (e.target.tagName.toLowerCase() === "a") return;
        selectLocation(Number(this.dataset.index));
      });
    });
  }

  window.initLaxccBeachMap = function () {
    const mapEl = document.getElementById("laxccGoogleMap");
    const loadingEl = document.getElementById("laxccMapLoading");

    if (!mapEl || !window.google || !google.maps) return;

    map = new google.maps.Map(mapEl, {
      center: { lat: 33.961922, lng: -118.420722 },
      zoom: 11,
      mapTypeControl: false,
      fullscreenControl: true,
      streetViewControl: true,
      gestureHandling: "cooperative"
    });

    infoWindow = new google.maps.InfoWindow();

    const bounds = new google.maps.LatLngBounds();

    DATA.forEach((loc, index) => {
      const marker = new google.maps.Marker({
        position: { lat: loc.lat, lng: loc.lng },
        map,
        title: (index + 1) + ". " + loc.name,
        label: {
          text: String(index + 1),
          color: "#ffffff",
          fontSize: "12px",
          fontWeight: "700"
        },
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          fillColor: loc.type === "dispensary" ? "#00AFC9" : "#1D508A",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 2,
          scale: loc.type === "dispensary" ? 14 : 12
        }
      });

      marker.addListener("click", function () {
        selectLocation(index);
      });

      markers[index] = marker;
      bounds.extend(marker.getPosition());
    });

    map.fitBounds(bounds);

    renderList();

    if (loadingEl) {
      loadingEl.style.display = "none";
    }

    const first = document.getElementById("laxcc-location-0");
    if (first) first.classList.add("active");
  };

  function selectLocation(index) {
    const loc = DATA[index];
    const marker = markers[index];

    if (!map || !marker) return;

    map.panTo({ lat: loc.lat, lng: loc.lng });
    map.setZoom(14);

    infoWindow.setContent(`
      <div style="padding:8px;max-width:220px;">
        <strong>${loc.name}</strong><br>
        <span style="font-size:13px;color:#555;">${loc.desc}</span><br><br>
        <a href="${loc.mapsLink}" target="_blank" rel="noopener">Get Directions</a>
      </div>
    `);

    infoWindow.open(map, marker);

    document.querySelectorAll("#laxccBeachMapWidget .laxcc-location").forEach(el => {
      el.classList.remove("active");
    });

    const active = document.getElementById("laxcc-location-" + index);
    if (active) {
      active.classList.add("active");
      active.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function loadGoogleMapsScript() {
    if (window.google && window.google.maps) {
      window.initLaxccBeachMap();
      return;
    }

    if (document.getElementById("laxccGoogleMapsScript")) return;

    const script = document.createElement("script");
    script.id = "laxccGoogleMapsScript";
    script.src = "https://maps.googleapis.com/maps/api/js?key=" + API_KEY + "&callback=initLaxccBeachMap";
    script.async = true;
    script.defer = true;
    document.body.appendChild(script);
  }

  renderList();
  loadGoogleMapsScript();
})();
</script>
