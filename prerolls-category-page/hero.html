<style>
    /* ===== LAXCC PREROLLS HERO - ELEMENTOR SAFE ===== */
    #laxcc-prerolls-hero-2025 {
        --primary: #F89459;
        --ocean: #00AFC9;
        --bg-dark: #1a120b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #laxcc-prerolls-hero-2025 [class^="laxcc-"],
    #laxcc-prerolls-hero-2025 [class*=" laxcc-"] {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* ===== HERO SECTION ===== */
    #laxcc-prerolls-hero-2025 .laxcc-hero-section {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        background-color: var(--bg-dark);
    }

    /* Shorter hero on mobile so the wide image fills with less zoom/crop */
    @media (max-width: 768px) {
        #laxcc-prerolls-hero-2025 .laxcc-hero-section {
            min-height: 65vh;
        }
    }

    #laxcc-prerolls-hero-2025 .laxcc-hero-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
    }

    #laxcc-prerolls-hero-2025 .laxcc-hero-mask {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: transparent;
    }

    #laxcc-prerolls-hero-2025 .laxcc-hero-image {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: right center;
        background-repeat: no-repeat;
        background-image: url('https://laxcc.com/wp-content/uploads/2024/12/best-prerolls-LA.jpg');
    }

    @media (max-width: 768px) {
        #laxcc-prerolls-hero-2025 .laxcc-hero-image {
            background-image: url('https://laxcc.com/wp-content/uploads/2024/08/best-pre-rolls-for-sale.jpg');
            background-size: auto 130%;
            background-position: center calc(50% - 50px);
        }
    }

    /* ===== ANIMATED BRAND-COLOR DIFFUSION ===== */
    #laxcc-prerolls-hero-2025 .laxcc-hero-diffuse {
        position: absolute;
        inset: -20%;
        z-index: 1;
        pointer-events: none;
        background:
            radial-gradient(38% 46% at 22% 30%, rgba(0, 175, 201, 0.70), transparent 62%),
            radial-gradient(42% 52% at 80% 24%, rgba(0, 175, 201, 0.65), transparent 62%),
            radial-gradient(46% 50% at 62% 82%, rgba(124, 58, 237, 0.55), transparent 62%),
            radial-gradient(44% 50% at 26% 78%, rgba(29, 80, 138, 0.55), transparent 62%);
        background-size: 200% 200%;
        mix-blend-mode: overlay;
        filter: blur(40px);
        animation: laxcc-diffuse 22s ease-in-out infinite;
    }
    @keyframes laxcc-diffuse {
        0%   { background-position: 0% 0%;   transform: scale(1); }
        25%  { background-position: 100% 0%; }
        50%  { background-position: 100% 100%; transform: scale(1.08); }
        75%  { background-position: 0% 100%; }
        100% { background-position: 0% 0%;   transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
        #laxcc-prerolls-hero-2025 .laxcc-hero-diffuse { animation: none; }
    }

    #laxcc-prerolls-hero-2025 .laxcc-verified {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 30;
        color: var(--ocean);
        font-size: 2.5rem;
    }

    #laxcc-prerolls-hero-2025 .laxcc-hero-content {
        width: 100% !important;
        max-width: none !important;
        position: relative;
        z-index: 20;
        text-align: center;
        padding: 0 1.5rem;
    }

    /* ===== ANIMATED TITLE ===== */
    @keyframes laxcc-prerolls-flow {
        0% { background-position: 100% 50%; }
        50% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    #laxcc-prerolls-hero-2025 .laxcc-title {
        background: linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.25) 0%,
            rgba(255, 255, 255, 0.25) 35%,
            #00AFC9 40%,
            #00D4E8 50%,
            #00AFC9 60%,
            rgba(255, 255, 255, 0.25) 65%,
            rgba(255, 255, 255, 0.25) 100%
        );
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: laxcc-prerolls-flow 12s ease-in-out infinite;
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        margin-bottom: 1rem;
        line-height: 0.9;
        max-width: 100%;
    }

    #laxcc-prerolls-hero-2025 .laxcc-subtitle {
        color: #fff;
        font-size: 1.25rem;
        font-weight: 600;
        max-width: none;
        margin: 0 auto 1rem;
    }

    #laxcc-prerolls-hero-2025 .laxcc-subtitle a {
        color: var(--ocean);
        text-decoration: none;
    }

    #laxcc-prerolls-hero-2025 .laxcc-subtitle a:hover {
        text-decoration: underline;
    }

    #laxcc-prerolls-hero-2025 .laxcc-desc {
        color: rgba(255, 255, 255, 0.85);
        font-size: 1rem;
        font-weight: 500;
        max-width: none;
        margin: 0 auto 2rem;
    }

    /* ===== LOCAL SEO: eyebrow, meta, CTA ===== */
    #laxcc-prerolls-hero-2025 .laxcc-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--ocean);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 1.1rem;
    }
    #laxcc-prerolls-hero-2025 .laxcc-eyebrow .laxcc-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ocean);
        flex-shrink: 0;
    }

    #laxcc-prerolls-hero-2025 .laxcc-meta {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.5rem 1.1rem;
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.82rem;
        font-weight: 600;
        margin: 0 auto 1.75rem;
        max-width: none;
    }
    #laxcc-prerolls-hero-2025 .laxcc-meta span {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        white-space: nowrap;
    }
    #laxcc-prerolls-hero-2025 .laxcc-meta a {
        color: rgba(255, 255, 255, 0.72);
        text-decoration: none;
    }
    #laxcc-prerolls-hero-2025 .laxcc-meta a:hover { color: #fff; }

    #laxcc-prerolls-hero-2025 .laxcc-cta-row {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.75rem;
    }
    #laxcc-prerolls-hero-2025 a.laxcc-cta,
    #laxcc-prerolls-hero-2025 a.laxcc-cta:link,
    #laxcc-prerolls-hero-2025 a.laxcc-cta:visited {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--primary);
        color: #fff !important;
        text-decoration: none !important;
        font-weight: 800;
        font-size: 1rem;
        padding: 0.9rem 1.7rem;
        border-radius: 100px;
        white-space: nowrap;
        transition: transform 0.2s ease, background 0.2s ease;
    }
    #laxcc-prerolls-hero-2025 a.laxcc-cta:hover {
        transform: translateY(-2px);
        background: #ef8345;
        color: #fff !important;
    }
    #laxcc-prerolls-hero-2025 a.laxcc-cta--ghost,
    #laxcc-prerolls-hero-2025 a.laxcc-cta--ghost:link,
    #laxcc-prerolls-hero-2025 a.laxcc-cta--ghost:visited {
        background: transparent;
        color: #fff !important;
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.4);
    }
    #laxcc-prerolls-hero-2025 a.laxcc-cta--ghost:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff !important;
    }
    @media (max-width: 639px) {
        #laxcc-prerolls-hero-2025 a.laxcc-cta,
        #laxcc-prerolls-hero-2025 a.laxcc-cta:link,
        #laxcc-prerolls-hero-2025 a.laxcc-cta:visited {
            font-size: 0.85rem;
            padding: 0.7rem 1.25rem;
        }
    }

    #laxcc-prerolls-hero-2025 .laxcc-scroll-hint {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        margin-top: 3rem;
        animation: laxcc-prerolls-bounce 2.4s ease-in-out infinite;
    }

    @keyframes laxcc-prerolls-bounce {
        0%, 100% { transform: translateY(-25%); }
        50% { transform: translateY(0); }
    }

    #laxcc-prerolls-hero-2025 .laxcc-scroll-text {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
    }

    #laxcc-prerolls-hero-2025 .laxcc-scroll-icon {
        color: rgba(255, 255, 255, 0.6);
        font-size: 1.5rem;
    }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 640px) {
        #laxcc-prerolls-hero-2025 .laxcc-title {
            font-size: 5rem;
        }
        #laxcc-prerolls-hero-2025 .laxcc-subtitle {
            font-size: 1.5rem;
        }
        #laxcc-prerolls-hero-2025 .laxcc-desc {
            font-size: 1.125rem;
        }
    }

    @media (min-width: 768px) {
        #laxcc-prerolls-hero-2025 .laxcc-title {
            font-size: 6rem;
        }
    }

    @media (min-width: 1024px) {
        #laxcc-prerolls-hero-2025 .laxcc-title {
            font-size: 8rem;
        }
    }

    @media (min-width: 1280px) {
        #laxcc-prerolls-hero-2025 .laxcc-title {
            font-size: 10rem;
        }
    }
</style>

<div id="laxcc-prerolls-hero-2025">
    <section class="laxcc-hero-section">

        <!-- Verified Badge -->
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
        <span class="laxcc-verified material-symbols-outlined" style="font-variation-settings: 'FILL' 1, 'wght' 700;">verified</span>

        <!-- Background -->
        <div class="laxcc-hero-bg">
            <div class="laxcc-hero-image"></div>
            <div class="laxcc-hero-diffuse"></div>
            <div class="laxcc-hero-mask"></div>
        </div>

        <!-- Content -->
        <div class="laxcc-hero-content">
            <h1 class="laxcc-title">Pre-Rolls Near LAX</h1>
            <p class="laxcc-desc">Singles, packs &amp; infused pre-rolls. Order ahead for pickup.</p>
            <div class="laxcc-scroll-hint">
                <span class="laxcc-scroll-text">Scroll</span>
                <span class="laxcc-scroll-icon">&#x25BC;</span>
            </div>
        </div>

    </section>
</div>
