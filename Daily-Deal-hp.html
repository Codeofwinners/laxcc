<script>
    (function () {
        var wrap = document.getElementById('lux-slider-system');
        if (!wrap) return;

        var slides = wrap.querySelectorAll('.lux-slide');
        var thumbs = wrap.querySelectorAll('.lux-thumb');
        var current = 0;
        var autoInterval = null;
        var manualOverride = false;

        // UI Elements
        var badge = document.getElementById('lux-sync-badge');
        var name = document.getElementById('lux-sync-name');
        var sub = document.getElementById('lux-sync-subtitle');
        var desc = document.getElementById('lux-sync-desc');
        var cta = document.getElementById('lux-sync-cta');

        function update(idx) {
            slides[current].classList.remove('lux-active');
            thumbs[current].classList.remove('lux-active');

            current = idx;
            var active = slides[current];

            active.classList.add('lux-active');
            thumbs[current].classList.add('lux-active');

            // Sync external text
            badge.textContent = active.getAttribute('data-badge');
            name.textContent = active.getAttribute('data-name');
            sub.textContent = active.getAttribute('data-subtitle');
            desc.textContent = active.getAttribute('data-desc');
            cta.href = active.getAttribute('data-link');

            // Handle nofollow for Stiiizy
            if (active.getAttribute('data-name').indexOf('Stiiizy') !== -1) {
                cta.setAttribute('rel', 'nofollow');
            } else {
                cta.removeAttribute('rel');
            }

            cta.textContent = "Shop " + active.getAttribute('data-name');
        }

        function stopAuto() {
            manualOverride = true;
            if (autoInterval) clearInterval(autoInterval);
        }

        wrap.addEventListener('click', function (e) {
            var thumb = e.target.closest('[data-idx]');
            if (thumb) {
                stopAuto();
                update(parseInt(thumb.getAttribute('data-idx'), 10));
                return;
            }

            var btnNext = e.target.closest('#lux-next');
            if (btnNext) {
                stopAuto();
                update((current + 1) % slides.length);
                return;
            }

            var btnPrev = e.target.closest('#lux-prev');
            if (btnPrev) {
                stopAuto();
                update((current - 1 + slides.length) % slides.length);
                return;
            }

            // Click on the active slide image → go to its data-link (same as CTA button).
            // Synthesize a real <a> click so the browser honors rel="nofollow noopener" —
            // crawlers ignore JS click handlers, but if any DOM-scraping tool reads this
            // page, the anchor we click carries the same rel as the CTA button.
            var slideEl = e.target.closest('.lux-slide.lux-active');
            if (slideEl) {
                var link = slideEl.getAttribute('data-link');
                if (link) {
                    var isStiiizy = (slideEl.getAttribute('data-name') || '').indexOf('Stiiizy') !== -1;
                    var rel = isStiiizy ? 'nofollow noopener noreferrer' : 'noopener';
                    var newTab = e.ctrlKey || e.metaKey;
                    var a = document.createElement('a');
                    a.href = link;
                    a.rel = rel;
                    if (newTab) a.target = '_blank';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            }
        });

        // Touch Support
        var touchStartX = 0;
        wrap.addEventListener('touchstart', function (e) {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        wrap.addEventListener('touchend', function (e) {
            var touchEndX = e.changedTouches[0].screenX;
            var diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                stopAuto();
                if (diff > 0) update((current + 1) % slides.length);
                else update((current - 1 + slides.length) % slides.length);
            }
        }, { passive: true });

        autoInterval = setInterval(function () {
            if (!manualOverride) {
                update((current + 1) % slides.length);
            }
        }, 6000);
    })();
</script>
