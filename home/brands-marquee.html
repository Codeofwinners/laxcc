<!-- LAXCC — Brands endless marquee (homepage section) -->
<!-- 100% CSS + HTML, ZERO JavaScript (no <script>, no onclick, no onerror) — WAF-safe, will not 403. -->
<!-- Auto-scrolls via CSS animation; hover pauses; header has pure-CSS Reverse + Pause/Play toggles (checkbox hack). -->
<!-- NOTE: brand-page slugs are generated from names (pattern /brand/<name>/). Verify any that 404. -->
<!-- REMOVED pending correct logo URLs: STIIIZY (had Rove's image), Raw (dupe of Raw Garden), Heirbloom (image 404'd). Send URLs to re-add. -->
<!-- NOTE: Raw Garden currently uses image a78f5481… — confirm that's actually Raw Garden's logo, not Raw's. -->
<style>
    .lbm {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #FCF9F2;
        padding: 2rem 0;
        width: 100%;
        overflow: hidden;
    }
    .lbm * { box-sizing: border-box; }

    .lbm-head {
        max-width: 1680px;
        margin: 0 auto 1.5rem;
        padding: 0 1.5rem;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem 2rem;
        flex-wrap: wrap;
    }
    .lbm-headings { display: flex; flex-direction: column; gap: 8px; }
    .lbm-eyebrow {
        font-size: .72rem;
        font-weight: 800;
        color: #F89459;
        text-transform: uppercase;
        letter-spacing: .18em;
        margin: 0;
    }
    .lbm-h {
        font-size: clamp(1.6rem, 3.4vw, 2.6rem);
        font-weight: 900;
        color: #1D508A;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin: 0;
    }
    .lbm-h span { color: #F89459; }
    .lbm-sub {
        font-size: .98rem;
        color: #64748b;
        line-height: 1.5;
        margin: 2px 0 0;
        max-width: 60ch;
    }
    .lbm-all {
        font-size: .8rem;
        font-weight: 800;
        color: #F89459 !important;
        text-decoration: none !important;
        text-transform: uppercase;
        letter-spacing: .08em;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding-bottom: 4px;
    }
    .lbm-all:hover { opacity: .8; }

    /* CSS-only auto-scroll marquee (no JS needed — WAF-safe) */
    .lbm-viewport {
        width: 100%;
        overflow: hidden;
    }
    .lbm-track {
        display: flex;
        width: max-content;
        gap: 16px;
        padding: 4px 16px;
        animation: lbm-scroll 55s linear infinite;
        will-change: transform;
    }
    /* Pause when hovering the strip */
    .lbm-viewport:hover .lbm-track { animation-play-state: paused; }
    @keyframes lbm-scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
    }

    /* Controls — PURE CSS checkbox toggles. Zero JavaScript (WAF-safe). */
    .lbm-toggle { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
    .lbm-head-right { display: flex; align-items: center; gap: 1rem; }
    .lbm-ctrls { display: flex; align-items: center; gap: .5rem; }
    .lbm-btn {
        width: 40px; height: 40px; padding: 0; border: none; border-radius: 50%;
        background: #1D508A; color: #fff; cursor: pointer; flex: 0 0 auto; line-height: 0;
        display: inline-flex; align-items: center; justify-content: center;
        transition: background .2s ease, transform .12s ease;
    }
    .lbm-btn:hover { background: #F89459; }
    .lbm-btn:active { transform: scale(.92); }
    .lbm-btn svg { width: 16px; height: 16px; display: block; }
    .lbm-btn .ico-play { display: none; }

    /* Pause toggle: when checked, freeze the marquee + swap pause icon → play icon */
    #lbm-pause:checked ~ .lbm-viewport .lbm-track { animation-play-state: paused !important; }
    #lbm-pause:checked ~ .lbm-head .lbm-btn-pause .ico-pause { display: none; }
    #lbm-pause:checked ~ .lbm-head .lbm-btn-pause .ico-play { display: block; }

    /* Reverse toggle: flip scroll direction */
    #lbm-rev:checked ~ .lbm-viewport .lbm-track { animation-direction: reverse; }
    #lbm-rev:checked ~ .lbm-head .lbm-btn-rev { background: #F89459; }

    /* Square white logo tiles — no rounded corners */
    .lbm-item {
        flex: 0 0 auto;
        width: 172px;
        height: 104px;
        background: #fff;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 22px;
        box-shadow: 0 3px 10px rgba(23, 34, 46, .06);
        text-decoration: none;
        transition: transform .2s ease, box-shadow .2s ease;
    }
    .lbm-item:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(23, 34, 46, .12); }
    .lbm-item img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
    }
</style>
